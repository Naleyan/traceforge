services:
  product:
    build: ./services/product
    ports:
      - "8001:8001"
    environment:
      DD_SERVICE: product
      DD_ENV: dev
      DD_VERSION: "0.1.0"
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.tags.service: product
      com.datadoghq.tags.env: dev
      com.datadoghq.tags.version: "0.1.0"
      com.datadoghq.ad.logs: '[{"source": "python", "service": "product"}]'
    depends_on:
      - datadog-agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 2s
      retries: 5

  order:
    build: ./services/order
    ports:
      - "8002:8002"
    environment:
      DD_SERVICE: order
      DD_ENV: dev
      DD_VERSION: "0.1.0"
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.tags.service: order
      com.datadoghq.tags.env: dev
      com.datadoghq.tags.version: "0.1.0"
      com.datadoghq.ad.logs: '[{"source": "python", "service": "order"}]'
    depends_on:
      - datadog-agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 2s
      retries: 5

  payment:
    build: ./services/payment
    ports:
      - "8003:8003"
    environment:
      DD_SERVICE: payment
      DD_ENV: dev
      DD_VERSION: "0.1.0"
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"

    labels:
      com.datadoghq.tags.service: payment
      com.datadoghq.tags.env: dev
      com.datadoghq.tags.version: "0.1.0"
      com.datadoghq.ad.logs: '[{"source": "python", "service": "payment"}]'
    depends_on:
      - datadog-agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 2s
      retries: 5

  gateway:
    build: ./services/gateway
    ports:
      - "8000:8000"
    environment:
      PRODUCT_URL: http://product:8001
      ORDER_URL: http://order:8002
      PAYMENT_URL: http://payment:8003
      HTTP_TIMEOUT_SECONDS: "2.0"
      DD_SERVICE: gateway
      DD_ENV: dev
      DD_VERSION: "0.1.0"
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.tags.service: gateway
      com.datadoghq.tags.env: dev
      com.datadoghq.tags.version: "0.1.0"
      com.datadoghq.ad.logs: '[{"source": "python", "service": "gateway"}]'
    depends_on:
      datadog-agent:
        condition: service_started
      product:
        condition: service_healthy
      order:
        condition: service_healthy
      payment:
        condition: service_healthy

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE}
      DD_HOSTNAME: traceforge-local
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE_LOGS: "name:datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro